<body style="margin:0; background:#1f1f1f;">
<canvas id="c"></canvas>

<script>
  
  const ctx = c.getContext('2d');

  c.width = window.innerWidth;
  c.height = window.innerHeight;

  const padW = 140;
  const padH = 125;
  const gridW = 460; //planned for 3 columns so 3x140 + 2x20 = 460, like 3 pads of each w=140px and 2 gaps of 20px b/w them
  const gridH = 270; //planned for 2 rows, 120x2 + 30 = 270 (height of each pad is 120px and 1 gap of 3px b/w them)
  const startX = (c.width - gridW) / 2;
  const startY = (c.height - gridH) / 2;

  const pads = [
    {label:'KICK', color:'#ffe066'},
    {label: 'SNARE', color:'#ffb347'},
    {label: 'HI-HAT', color:'#ff6b6b'},
    {label: 'PIANO', color:'#b19ffb'},
    {label:'BASS', color:'#74c0fc'},
    {label: 'ELECTRO', color:'#dbe4ff'}
  ];

  let activePad = -1;

  let audioCtx;

  function playSound(w) {
    audioCtx = new window.AudioContext;

    const t = audioCtx.currentTime;
    const Gain = audioCtx.createGain();
    Gain.connect(audioCtx.destination);

    if (w === 1 || w === 2) {
      const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
      const channelData = buffer.getChannelData(0);
      for (let i=0; i < channelData.length; i++ ) {
        channelData[i] = Math.random() * 2 - 1; //fills the audio memory buffer w/ numbers between 1 and -1 to produce pur white noise
      }

      const Bsource = audioCtx.createBufferSource();
      const filter = audioCtx.createBiquadFilter();

      Bsource.buffer = buffer;
      filter.type = 'highpass';
      filter.frequency.value = (w===2) ? 7000 : 1000; //7khz for hi-hat and 1khz for snare
      
      Bsource.connect(filter);
      filter.connect(Gain);

      Gain.gain.setValueAtTime(0.5, t);
      Gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      Bsource.start(t);
  }

  else {
    const oscill = audioCtx.createOscillator();
    oscill.connect(Gain);

    if (w === 0) { //for kick drum [150Hz to 30Hz]
      oscill.frequency.setValueAtTime(150,t);
      oscill.frequency.exponentialRampToValueAtTime(30, t + 0.3);
      Gain.gain.setValueAtTime(1.0, t);
    }
    else if (w === 3) { //for piano
      oscill.type = 'triangle';
      oscill.frequency.value = 523; //plays 523Hz
      Gain.gain.setValueAtTime(0.4, t);
    }
    else if (w===4) { //for Bass [110Hz to 30Hz]
      oscill.type = 'sawtooth';
      oscill.frequency.setValueAtTime(110, t);
      oscill.frequency.exponentialRampToValueAtTime(30, t + 0.25);
      Gain.gain.setValueAtTime(0.5, t);
    }
    else if (w === 5) { //for Electro [1200hz to 50hz]
      oscill.type = 'square';
      oscill.frequency.setValueAtTime(1200, t);
      oscill.frequency.exponentialRampToValueAtTime(50, t + 0.12);
      Gain.gain.setValueAtTime(0.2, t);
    }

    Gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    oscill.start(t);
    oscill.stop(t + 3);
  }
}

  const handleInput = (e) => {
    const rect = c.getBoundingClientRect();
    const posx = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
    const posy = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
  
    pads.forEach((pad, i) => {
      const col = i % 3;
      const row = Math.floor(i / 3);
      const px = startX + col * (padW+20);
      const py = startY + row * (padH+20);

      if (posx >= px && posx <= px+padW && posy >= py && posy <= py+padH) { //checks if the click/tap fell within the rectangle's coordinates
        activePad = i;
        playSound(i);
        draw();

        setTimeout(() => { // the selected pad will be active for 100ms, helpful for press-down effect
          activePad = -1;
          draw();
        }, 100);
      }
  });
};

window.onclick = handleInput;
window.ontouchstart = handleInput;

  function draw() {

    ctx.fillStyle = '#1f1f1f';
    ctx.fillRect(0,0, c.width, c.height); //clear screen everytime before displaying the pads

    pads.forEach((pad, i) => {
      const col = i % 3; //determines the col 1 or 2 or 3
      const row = Math.floor(i/3); //divides the index and uses GIF(down to the nearest integer). 0 for top row and 1 for bottom row

      const press = (activePad === i) ? 4 : 0; // press=4 if the current pad is clicked by the user and press=0 when not clicked
      const px = startX + col * (padW+20) + press; // so, when we add press for px(or py), the pad goes slightly towards bottom & right.. giving it a press-down effect
      const py = startY + row * (padH+20) + press;

      ctx.fillStyle = '#1a1a1a';
      ctx.strokeStyle = pad.color; // respectve color of that pad
      ctx.lineWidth = 3;
      ctx.fillRect(px, py, padW, padH);
      ctx.strokeRect(px, py, padW, padH);

      ctx.fillStyle = pad.color;
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(pad.label, px + (padW/2), py + (padH/2) + 5); // Uses the respective name of that pad & +5 so that text looks like its more centered
    });

    ctx.strokeStyle = '#444';
    ctx.lineWidth = 2;
    ctx.strokeRect(startX - 20, startY - 20, gridW + 40, gridH + 40); // outer box for the grid, giving it a more real life drum pad like feel and padding for all the four sides

    ctx.fillStyle = '#339af0'
    ctx.font = ('30px cursive'); // cursive font like in my sketch
    ctx.textAlign = 'center';
    ctx.fillText('Music Pad', c.width/2, startY+gridH + 65); //text centered(horizontally) and aligned below the outer frame vertically
  }

draw();
</script>
</body>
